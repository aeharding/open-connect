<path d="M210 556L535 556" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="372" y="530" class="tiny" text-anchor="middle">4A→2A GND · 4C→2C USB power</text>
<text x="372" y="588" class="small" text-anchor="middle">4B↔2B D+ · 4D↔2D D−</text>
<text x="26" y="641" class="small">Mating-plug face, key up: A,C above B,D (mirror of each socket).</text>
<text x="26" y="671" class="small">USB power is 5 V. Never connect the 12 V bench supply to these contacts.</text>
<text x="24" y="722" class="head">COMMON CARPLAY RETROFIT · two supplied cables</text>
<rect x="30" y="748" width="300" height="135" rx="8" class="box"/>
<text x="44" y="778" class="head">CMU rear sockets</text>
<text x="44" y="806" class="small">Left: gray/green cable end</text>
<text x="44" y="831" class="small">Right: gray/blue cable end</text>
<text x="44" y="856" class="small">Rear view; module upright</text>
<rect x="430" y="748" width="300" height="135" rx="8" class="box"/>
<text x="444" y="778" class="head">Replacement hub</text>
<text x="444" y="806" class="small">Black keyed cable socket</text>
<text x="444" y="831" class="small">Brown keyed cable socket</text>
<text x="444" y="856" class="small">12-way plug retained intact</text>
<path d="M337 790L422 790" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M337 819L422 819" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="26" y="918" class="small">Gray/green ↔ black; gray/blue ↔ brown. Match molded keys at both ends.</text>
<text x="26" y="948" class="small">These boxes are cable routes, not connector faces or contact pinouts.</text>
<text x="26" y="978" class="small">Old USB cable: disconnected and insulated at both ends after retrofit.</text>
<text x="26" y="1020" class="small">Hub front USB data port ↔ USB Ethernet adapter ↔ RJ45 ↔ network</text>
<text x="26" y="1050" class="small">Incoming hub/adapter: physical fit and firmware/driver support unqualified.</text>
<a href="https://mazda3.neocities.org/esicont/srvc/html/id0902n7105300">
<text x="26" y="1092" class="tiny">Mazda3 USB service drawing B1252:87</text>
</a>
<a href="https://www.mx5manual.com/assets/service_manuals/en_us/2016/MX5/pdf/0920_2b.pdf">
<text x="26" y="1119" class="tiny">12-way face: Mazda 2016 MX-5 0920-206A, PDF page 2; functions: Mazda3 TN-M3-1311</text>
</a>
<a href="https://mazdaparts.org/content/MAZDA3SCREENMIRRORC922V6605.pdf">
<text x="26" y="1146" class="tiny">Mazda3 C922 V6 605 retrofit instructions, Common-4: cable routes</text>
</a>
<text x="26" y="1180" class="small">Use assembled cables; this guide does not assign aftermarket USB conductor order.</text>
