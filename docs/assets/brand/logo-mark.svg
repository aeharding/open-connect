<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Mazda Open Connect">
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <defs>
    <linearGradient id="oc-ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f5f8"/>
      <stop offset=".48" stop-color="#b6becb"/>
      <stop offset="1" stop-color="#767f8f"/>
    </linearGradient>
    <linearGradient id="oc-dial" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262a34"/>
      <stop offset="1" stop-color="#111319"/>
    </linearGradient>
    <linearGradient id="oc-red" x1="18" y1="14" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset=".55" stop-color="#e11d36"/>
      <stop offset="1" stop-color="#a80f24"/>
    </linearGradient>
    <radialGradient id="oc-glow" cx="52.5" cy="32" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b57" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e11d36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle commander-dial knurl ticks (excluding the open gap on the right) -->
  <g stroke="#8e97a8" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="3.2" x2="32" y2="5.4"/>
    <line x1="32" y1="58.6" x2="32" y2="60.8"/>
    <line x1="3.2" y1="32" x2="5.4" y2="32"/>
    <line x1="11.6" y1="11.6" x2="13.2" y2="13.2"/>
    <line x1="11.6" y1="52.4" x2="13.2" y2="50.8"/>
    <line x1="46.4" y1="7.1" x2="45.3" y2="9.0"/>
    <line x1="46.4" y1="56.9" x2="45.3" y2="55.0"/>
    <line x1="7.1" y1="17.6" x2="9.0" y2="18.7"/>
    <line x1="7.1" y1="46.4" x2="9.0" y2="45.3"/>
  </g>

  <!-- Recessed obsidian commander dial core -->
  <circle cx="32" cy="32" r="14.5" fill="url(#oc-dial)" stroke="#3e4452" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="10.2" stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>

  <!-- Outer open commander ring (open gap on the right) -->
  <path d="M51.31 47.08 A24.5 24.5 0 1 1 51.31 16.92" stroke="url(#oc-ring)" stroke-width="4.4" stroke-linecap="round"/>

  <!-- Soul Red Crystal active indicator arc -->
  <path d="M18.42 20.60 A17.7 17.7 0 0 1 46.84 22.36" stroke="url(#oc-red)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Luminous connection node inside the open gap -->
  <circle cx="52.5" cy="32" r="7.5" fill="url(#oc-glow)"/>
  <circle cx="52.5" cy="32" r="3.6" fill="url(#oc-red)"/>
  <circle cx="51.4" cy="30.9" r="1.1" fill="#ffc2cb" fill-opacity=".85"/>
</svg>
