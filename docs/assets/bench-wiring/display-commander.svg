<text x="26" y="318" class="small">Fused B+ → 1H · Switched ACC → 1G · 1B → common ground</text>
<text x="26" y="348" class="small">1A, 1C, 1D, 1E, 1F: unused. Keep Mazda labels; do not renumber.</text>
