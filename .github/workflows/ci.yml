name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OC_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check --output-format=github tooling tests
      - name: Format
        run: ruff format --check tooling tests
      - name: Install native and media test tools
        run: |
          missing=()
          command -v clang >/dev/null || missing+=(clang)
          command -v ld.lld >/dev/null || missing+=(lld)
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            missing+=(ffmpeg)
          fi
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -y --no-install-recommends install "${missing[@]}"
          fi
          echo "OC_LLD=$(command -v ld.lld)" >> "$GITHUB_ENV"
      - name: Offline host tests
        run: python tests/run_offline.py
      - name: Optional loader probe (public inputs only)
        run: python -m unittest discover -s experiments/optional-loader -v
      - name: Boot selection (host checks and ARM build only)
        run: |
          python -m unittest discover -s experiments/boot-selection -v
          python -m open_connect.firmware55.build_flush --output runs/selector-ci
          python -m open_connect.firmware55.build_receiver --output runs/receiver-ci
          python experiments/boot-selection/build_namespace.py --output runs/namespace-ci
      - name: Build and test the v55 installer controls
        run: |
          mkdir -p runs/installer-controls
          cat cmu/installer/dialog.js cmu/installer/settings.js > runs/installer-controls/installer.js
          node tests/fixtures/installer-dialog.js runs/installer-controls/installer.js
          node tests/fixtures/installer-settings.js runs/installer-controls/installer.js
          cp LICENSE runs/installer-controls/LICENSE
          (cd runs/installer-controls && sha256sum installer.js > SHA256SUMS)
      - name: Save tested installer controls
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fw55-installer-controls
          path: runs/installer-controls/
          if-no-files-found: error
          retention-days: 7
      - name: Installed CLI outside checkout
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import open_connect

          assert not Path(open_connect.__file__).resolve().is_relative_to(
              Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          ), "must test the installed package, not checkout imports"
          subprocess.run(["oc", "--help"], check=True)
          profile = json.loads(subprocess.check_output(["oc", "bench", "setup"], text=True))
          assert profile["outcome"] == "dry_run_not_executed"
          assert profile["executed"] is False and profile["state_written"] is False
          assert profile["opens_port"] is False
          uart = json.loads(subprocess.check_output(["oc", "uart"], text=True))
          assert uart["mode"] == "dry_run"
          assert uart["opens_port"] is False and uart["sends_bytes"] is False
          assert not list(Path.cwd().iterdir()), "dry runs must not write state"
          print("Installed CLI dry runs passed without device access or state writes.")
          PY
      - name: Save host test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-test-results
          path: |
            runs/tests/**/manifest.json
            runs/tests/**/tests.txt
          if-no-files-found: ignore
          retention-days: 7
