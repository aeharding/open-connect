<text x="26" y="325" class="small">Fused B+ → 1L · Switched ACC → 1K · 1A, 1J → common ground</text>
<text x="26" y="354" class="small">Other pins: AUX audio/detect/shields or unused; isolate for silent USB use.</text>
<text x="26" y="383" class="small">All faces look into contacts; latch/key up. Shapes are not to scale.</text>
<text x="24" y="432" class="head">ORIGINAL HUB · one factory USB cable</text>
