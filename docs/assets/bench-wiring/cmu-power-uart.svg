<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc">
<title id="title">CMU power and UART connector faces</title><desc id="desc">Original schematic of the blue 18-terminal CMU connector. Both views look into contacts; plug face is mirrored. Latch at top. All terminal positions labeled, including unused cavities. See the guide for sources.</desc>
