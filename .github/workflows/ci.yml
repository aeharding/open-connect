name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*-dev.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OC_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check development release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat cmu/installer/VERSION)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Install JavaScript test parser
        run: npm ci --ignore-scripts
      - name: Lint
        run: ruff check --output-format=github tooling tests
      - name: Format
        run: ruff format --check tooling tests
      - name: Install native build tools
        run: |
          missing=()
          command -v clang >/dev/null || missing+=(clang)
          command -v ld.lld >/dev/null || missing+=(lld)
          command -v llvm-objcopy >/dev/null || missing+=(llvm)
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -y --no-install-recommends install "${missing[@]}"
          fi
          echo "OC_LLD=$(command -v ld.lld)" >> "$GITHUB_ENV"
      - name: UI checks
        run: make check-ui
      - name: Build native patch and USB package with standard tools
        run: make release OUT=runs/release
      - name: Save USB installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usb-installer
          path: |
            runs/release/open-connect-*-usb.zip
            runs/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Installed CLI outside checkout
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import open_connect

          assert not Path(open_connect.__file__).resolve().is_relative_to(
              Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          ), "must test the installed package, not checkout imports"
          subprocess.run(["oc", "--help"], check=True)
          profile = json.loads(subprocess.check_output(["oc", "bench", "setup"], text=True))
          assert profile["outcome"] == "dry_run_not_executed"
          assert profile["executed"] is False and profile["state_written"] is False
          assert profile["opens_port"] is False
          uart = json.loads(subprocess.check_output(["oc", "uart"], text=True))
          assert uart["mode"] == "dry_run"
          assert uart["opens_port"] is False and uart["sends_bytes"] is False
          assert not list(Path.cwd().iterdir()), "dry runs must not write state"
          print("Installed CLI dry runs passed without device access or state writes.")
          PY

  host-tests:
    name: Offline tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      OC_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Install JavaScript test parser
        run: npm ci --ignore-scripts
      - name: Install native and media test tools
        run: |
          missing=()
          command -v clang >/dev/null || missing+=(clang)
          command -v ld.lld >/dev/null || missing+=(lld)
          command -v llvm-objcopy >/dev/null || missing+=(llvm)
          command -v busybox >/dev/null || missing+=(busybox)
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            missing+=(ffmpeg)
          fi
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -y --no-install-recommends install "${missing[@]}"
          fi
          echo "OC_LLD=$(command -v ld.lld)" >> "$GITHUB_ENV"
      - name: BusyBox listener tests
        run: |
          if ! busybox --list | grep -q '^tcpsvd$'; then
            image=busybox@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
            container=$(docker create "$image")
            trap 'docker rm "$container" >/dev/null' EXIT
            mkdir -p "$RUNNER_TEMP/oc-test-tools"
            docker cp "$container:/bin/busybox" "$RUNNER_TEMP/oc-test-tools/busybox"
            chmod 700 "$RUNNER_TEMP/oc-test-tools/busybox"
            echo "OC_TEST_BUSYBOX=$RUNNER_TEMP/oc-test-tools/busybox" >> "$GITHUB_ENV"
          fi
      - name: Offline host tests
        run: python tests/run_offline.py --shard "${{ matrix.shard }}"
      - name: Save host test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-test-results-${{ strategy.job-index }}
          path: |
            runs/tests/**/manifest.json
            runs/tests/**/tests.txt
          if-no-files-found: ignore
          retention-days: 7

  prerelease:
    name: Prepare development prerelease
    needs: [host, host-tests]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'aeharding/open-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download checked USB bundle and create draft
        run: |
          gh run download "$GITHUB_RUN_ID" --name usb-installer --dir release
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/*-usb.zip release/SHA256SUMS \
            --verify-tag --draft --prerelease --title "Open Connect $GITHUB_REF_NAME" \
            --notes "Development prerelease for exactly **74.00.324A NA/cmu150_NA**. See the [USB installer guide](https://aeharding.github.io/open-connect/usb-installer/) for installation, recovery and qualification limits."
