<path d="M200 510L534 510" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="367" y="490" class="small" text-anchor="middle">3B ↔ 2B (+); 3D ↔ 2D (−)</text>
<text x="367" y="545" class="small" text-anchor="middle">Image → / touch + status ←</text>
<text x="26" y="600" class="small">Each mating-plug face is A,C above B,D (left → right), key up.</text>
<text x="26" y="628" class="small">Use the complete cable and shield. A/C are unused; never apply 12 V.</text>
