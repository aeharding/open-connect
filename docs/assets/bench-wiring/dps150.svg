<svg xmlns="http://www.w3.org/2000/svg" width="680" height="780" viewBox="0 0 680 780" role="img" aria-labelledby="title desc">
<title id="title">FNIRSI DPS150 connections</title><desc id="desc">Separate host Micro-USB serial control, power input, and bench DC output. Socket outlines are identification views with no contact breakout. For the established lab, keep the output setting unchanged. On a new bench, check nominal 12 V output with modules disconnected. Input voltage must exceed output voltage.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18212b;font-size:20px}.title{font-size:28px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:17px}.tiny{font-size:15px}.pin{font-size:22px;font-weight:bold}.power{fill:#fff0e9}.data{fill:#e7f3ff}.gnd{fill:#e9ecef}.unused{fill:#f6f6f6}.box{fill:#fff;stroke:#18212b;stroke-width:2}.wire{fill:none;stroke:#18212b;stroke-width:3}.planned{stroke-dasharray:9 6}a text{fill:#155c91;text-decoration:underline}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#18212b"/></marker></defs>
<rect width="680" height="780" rx="10" fill="#fff"/>
<text x="24" y="40" class="title">FNIRSI DPS150 · three separate paths</text>
<text x="24" y="73" class="head">Established lab: keep the output setting unchanged.</text>
<text x="24" y="99" class="small">New bench: check nominal 12 V output with modules disconnected.</text>
<rect x="30" y="110" width="620" height="120" rx="8" class="box"/>
<text x="44" y="140" class="head">1 · Host USB ↔ supply serial control</text>
<text x="44" y="168" class="small">Computer USB → data cable → DPS150 Micro-USB communication</text>
<text x="44" y="193" class="small">No FT232R in this path; no connection to the Mazda USB hub.</text>
<text x="205" y="272" class="head" text-anchor="middle">DPS150 module/socket face</text>
<path d="M105 297H305V323L279 340H131L105 323Z" class="box"/>
<text x="205" y="369" class="small" text-anchor="middle">Micro-USB · narrow edge down</text>
<text x="205" y="396" class="small" text-anchor="middle">Keyed shell; no external latch</text>
<text x="383" y="310" class="small">↔ USB data / serial protocol</text>
<text x="383" y="340" class="small">Use the complete USB cable.</text>
<text x="383" y="370" class="small">No pin breakout shown.</text>
<rect x="30" y="427" width="620" height="125" rx="8" class="box"/>
<text x="44" y="457" class="head">2 · Supply input power</text>
<text x="44" y="485" class="small">PD/QC source → USB-C INPUT, or DC adapter → DC INPUT.</text>
<text x="44" y="510" class="small">Step-down only: input must exceed the nominal 12 V output.</text>
<text x="44" y="535" class="small">A 5 V USB source is insufficient. Use one power input at a time.</text>
<rect x="30" y="578" width="620" height="117" rx="8" class="box"/>
<text x="44" y="608" class="head">3 · Supply DC output → bench</text>
<text x="44" y="636" class="small">DPS150 + → fuse → B+ bus and ACC switch input</text>
<text x="44" y="661" class="small">DPS150 − → common ground bus</text>
<text x="44" y="686" class="small">Output-off is a hard power cut, not an ACC-only shutdown.</text>
<a href="https://www.fnirsi.com/pages/software-downloads">
<text x="30" y="732" class="tiny">FNIRSI: PC connection via Micro data cable</text>
</a>
<a href="https://www.fnirsi.com/products/dps-150">
<text x="30" y="759" class="tiny">FNIRSI: step-down operation and input requirements</text>
</a>
</svg>
