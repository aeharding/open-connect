<text x="26" y="891" class="small">Switched ACC → A · CMU 2K ↔ E (LIN) · G → common ground</text>
<text x="26" y="921" class="small">B = TNS lighting input; H = illumination return: isolate for unlit use.</text>
<text x="26" y="951" class="small">C, D, F: unused. LIN carries the buttons, dial and joystick actions.</text>
