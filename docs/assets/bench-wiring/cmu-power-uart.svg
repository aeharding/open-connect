<text x="30" y="500" class="small">Turn the plug around to see its wire-entry side: that is NOT the lower view.</text>
<text x="30" y="540" class="small">Fused supply + → 2R (B+) · Fused supply + → ACC switch → 2Q</text>
<text x="30" y="573" class="small">2C, 2D, 2L → common supply − / ground · 2K ↔ commander E (LIN)</text>
<text x="30" y="606" class="small">2S (CMU TX out) → adapter RX in · Adapter TX out → 2T (CMU RX in)</text>
<text x="30" y="645" class="small">All other shown pins: leave unconnected for this silent bench.</text>
<text x="30" y="675" class="small">× = keyed gap, no terminal. 2O uses the letter O, not zero.</text>
<text x="30" y="705" class="small">UART: 3.3 V TTL · adapter power lead disconnected · 115200 / 8N1</text>
