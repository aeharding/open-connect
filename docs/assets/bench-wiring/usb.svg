<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1200" viewBox="0 0 760 1200" role="img" aria-labelledby="title desc">
<title id="title">Stock Mazda USB hub and common CarPlay retrofit cable routes</title><desc id="desc">Stock hub power socket and mirrored cable plug with twelve terminal labels. Stock USB socket contacts. Retrofit uses matched gray/green to black and gray/blue to brown cable assemblies. Retrofit internal contacts are not assigned.</desc>
