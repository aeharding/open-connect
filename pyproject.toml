[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-connect"
version = "0.1.0"
description = "Host tools for Mazda Connect development"
requires-python = ">=3.10"
dependencies = ["pyserial==3.5"]
license = {text = "AGPL-3.0-or-later"}

[project.optional-dependencies]
dev = ["ruff==0.17.5"]
docs = ["zensical==0.1.1"]

[project.scripts]
oc = "open_connect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["experiments", "runs", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
